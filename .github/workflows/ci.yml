name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prodexa
          POSTGRES_PASSWORD: prodexa
          POSTGRES_DB: prodexa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prodexa" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://prodexa:prodexa@localhost:5432/prodexa_test
          TEST_DATABASE_URL: postgresql+psycopg://prodexa:prodexa@localhost:5432/prodexa_test
          REDIS_URL: redis://localhost:6399/0
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://prodexa:prodexa@localhost:5432/prodexa_test
        run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
