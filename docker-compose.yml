services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prodexa
      POSTGRES_PASSWORD: prodexa
      POSTGRES_DB: prodexa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodexa"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://prodexa:prodexa@db:5432/prodexa
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
